<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f7" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self' https://localhost capacitor://localhost"
    />
    <title>离线文字识别</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app-frame">
      <header class="app-header">
        <div class="brand">
          <img src="/OCR.png" alt="" class="brand-icon" />
          <div>
            <h1>离线文字识别</h1>
            <p>证件 OCR</p>
          </div>
        </div>
        <span class="offline-state"><span aria-hidden="true"></span>本地运行</span>
      </header>

      <main>
        <section class="workflow-section" aria-labelledby="image-title">
          <div class="section-heading">
            <div>
              <span class="section-index">01</span>
              <h2 id="image-title">证件图片</h2>
            </div>
            <span class="section-meta">JPG · PNG · WEBP</span>
          </div>

          <button id="select-image" class="select-button" type="button">
            <i data-lucide="image-plus" aria-hidden="true"></i>
            <span>
              <strong id="select-label">选择一张图片</strong>
              <small id="select-detail">单张 · 最大 25 MB</small>
            </span>
          </button>

          <div id="preview-shell" class="preview-shell" hidden>
            <img id="preview" alt="所选证件图片预览" />
            <div class="preview-caption">
              <div>
                <strong id="image-name"></strong>
                <span id="image-meta"></span>
              </div>
              <button id="remove-image" class="icon-button" type="button" title="移除图片" aria-label="移除图片">
                <i data-lucide="x" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <button id="recognize" class="primary-button" type="button" disabled>
            <i data-lucide="scan-text" aria-hidden="true"></i>
            <span id="recognize-label">开始识别</span>
            <span class="button-spinner" aria-hidden="true"></span>
          </button>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </section>

        <section id="results" class="results-section" aria-labelledby="id-title" hidden>
          <div class="result-block">
            <div class="section-heading compact">
              <div>
                <span class="section-index">02</span>
                <h2 id="id-title">身份证号</h2>
              </div>
              <span id="id-count" class="section-meta"></span>
            </div>
            <div id="id-list" class="id-list"></div>
          </div>

          <div class="result-block text-result">
            <div class="section-heading compact">
              <div>
                <span class="section-index">03</span>
                <h2>全部文字</h2>
              </div>
              <button id="copy-all" class="quiet-button" type="button" disabled>
                <i data-lucide="copy" aria-hidden="true"></i>
                复制全文
              </button>
            </div>
            <div id="text-lines" class="text-lines"></div>
          </div>
        </section>

        <section id="diagnostics" class="diagnostics-section" aria-labelledby="diagnostics-title" hidden>
          <div class="section-heading compact">
            <div>
              <span class="section-index">04</span>
              <h2 id="diagnostics-title">性能评测</h2>
            </div>
            <div class="diagnostic-actions">
              <button id="copy-diagnostics" class="icon-button" type="button" title="复制日志" aria-label="复制日志" disabled>
                <i data-lucide="clipboard-copy" aria-hidden="true"></i>
              </button>
              <button id="clear-diagnostics" class="icon-button" type="button" title="清空日志" aria-label="清空日志">
                <i data-lucide="trash-2" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <dl id="metrics-summary" class="metrics-summary"></dl>

          <div class="diagnostic-block">
            <h3>阶段耗时</h3>
            <dl id="timing-details" class="timing-details"></dl>
          </div>

          <div class="diagnostic-block">
            <h3>进程内存</h3>
            <div class="table-scroll">
              <table class="memory-table">
                <thead>
                  <tr>
                    <th>阶段</th>
                    <th>PSS</th>
                    <th>Java 已用/上限</th>
                    <th>Native</th>
                  </tr>
                </thead>
                <tbody id="memory-table-body"></tbody>
              </table>
            </div>
          </div>

          <div class="diagnostic-block">
            <h3>会话日志</h3>
            <ol id="session-log" class="session-log" aria-live="polite"></ol>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
