<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f3f5" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self' https://localhost capacitor://localhost"
    />
    <title>离线文字识别</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <img src="/OCR.png" alt="" class="brand-icon" />
          <div>
            <h1>离线文字识别</h1>
            <p>证件图片本地处理</p>
          </div>
        </div>

        <div class="header-actions">
          <span class="offline-state"><span aria-hidden="true"></span>离线</span>
          <button
            id="developer-toggle"
            class="icon-button developer-toggle"
            type="button"
            title="双击切换开发者日志"
            aria-label="双击切换开发者日志"
            aria-pressed="false"
          >
            <i data-lucide="square-terminal" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <main>
        <section class="page-section" aria-labelledby="image-title">
          <p class="section-title" id="image-title">证件图片</p>
          <div class="group-card image-workspace">
            <button id="select-image" class="picker-row" type="button">
              <span class="feature-icon"><i data-lucide="image-plus" aria-hidden="true"></i></span>
              <span class="picker-copy">
                <strong id="select-label">选择图片</strong>
                <small id="select-detail">JPG、PNG、WEBP · 最大 25 MB</small>
              </span>
              <i data-lucide="chevron-right" class="row-chevron" aria-hidden="true"></i>
            </button>

            <div id="preview-shell" class="preview-shell" hidden>
              <button
                id="preview-toggle"
                class="preview-toggle"
                type="button"
                aria-label="放大图片预览"
                aria-expanded="false"
              >
                <img id="preview" alt="所选证件图片预览" />
                <span class="preview-action" aria-hidden="true">
                  <i data-lucide="maximize-2" class="expand-icon"></i>
                  <i data-lucide="minimize-2" class="collapse-icon"></i>
                </span>
              </button>

              <div class="preview-caption">
                <div>
                  <strong id="image-name"></strong>
                  <span id="image-meta"></span>
                </div>
                <button id="remove-image" class="icon-button" type="button" title="移除图片" aria-label="移除图片">
                  <i data-lucide="x" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <div class="primary-action-row">
              <button id="recognize" class="primary-button" type="button" disabled>
                <i data-lucide="scan-text" aria-hidden="true"></i>
                <span id="recognize-label">开始识别</span>
                <span class="button-spinner" aria-hidden="true"></span>
              </button>
              <p id="status" class="status" role="status" aria-live="polite"></p>
            </div>
          </div>
        </section>

        <section id="results" class="page-section" aria-labelledby="result-title" hidden>
          <p class="section-title">识别结果</p>
          <div class="group-card result-card">
            <div class="card-heading">
              <h2 id="result-title">全部文字</h2>
              <button id="copy-all" class="quiet-button" type="button" disabled>
                <i data-lucide="copy" aria-hidden="true"></i>
                <span>复制全文</span>
              </button>
            </div>
            <pre class="ocr-output"><code id="ocr-output"></code></pre>
          </div>
        </section>

        <section id="developer-log" class="page-section developer-section" aria-labelledby="developer-title" hidden>
          <p class="section-title">开发者</p>
          <div class="group-card log-card">
            <div class="card-heading">
              <h2 id="developer-title">运行日志</h2>
              <div class="log-actions">
                <button id="copy-log" class="icon-button" type="button" title="复制日志" aria-label="复制日志" disabled>
                  <i data-lucide="clipboard-copy" aria-hidden="true"></i>
                </button>
                <button id="clear-log" class="icon-button" type="button" title="清空日志" aria-label="清空日志">
                  <i data-lucide="trash-2" aria-hidden="true"></i>
                </button>
              </div>
            </div>
            <pre id="session-log" class="session-log" role="log" aria-live="polite"></pre>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
