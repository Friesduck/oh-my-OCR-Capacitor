apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def signingPath = System.getenv('ANDROID_KEYSTORE_PATH')
def signingAlias = System.getenv('ANDROID_KEY_ALIAS')
def signingPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = signingPath && signingAlias && signingPassword

android {
    namespace = 'com.example.rapidocrcapacitor'
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.example.rapidocrcapacitor'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'arm64-v8a'
        }

        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(signingPath)
                storePassword signingPassword
                keyAlias signingAlias
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
}

repositories {
    flatDir {
        dirs 'libs', '../capacitor-cordova-android-plugins/src/main/libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/OcrLibrary-0.1.0-release.aar')
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    implementation 'com.orhanobut:logger:2.2.0'
    implementation 'org.opencv:opencv:4.12.0'

    testImplementation "junit:junit:$junitVersion"
}

apply from: 'capacitor.build.gradle'
